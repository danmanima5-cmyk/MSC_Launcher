<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>MSC Launcher Tiles</title>
    <link rel="stylesheet" href="css/default.css">
</head>
<body>
    <main id="app">
        <header>
            <div class="brand-mark"><img src="images/logo-150.png" alt=""></div>
            <div>
                <h1>MSC Launcher</h1>
                <p>Плиточная библиотека</p>
            </div>
        </header>

        <section class="tile-grid" aria-label="Разделы MSC Launcher">
            <article class="tile tile-wide violet" data-section="play">
                <button class="open"><span class="glyph">▶</span><strong>Играть</strong><small>Выбрать профиль Minecraft</small></button>
                <button class="pin" title="Закрепить на начальном экране">⌖</button>
            </article>
            <article class="tile green" data-section="library">
                <button class="open"><span class="glyph">▦</span><strong>Библиотека</strong><small>Установленные профили</small></button>
                <button class="pin" title="Закрепить на начальном экране">⌖</button>
            </article>
            <article class="tile cyan" data-section="mods">
                <button class="open"><span class="glyph">✚</span><strong>Моды</strong><small>Modrinth и CurseForge</small></button>
                <button class="pin" title="Закрепить на начальном экране">⌖</button>
            </article>
            <article class="tile magenta" data-section="skins">
                <button class="open"><span class="glyph">♙</span><strong>Скины</strong><small>Облик персонажа</small></button>
                <button class="pin" title="Закрепить на начальном экране">⌖</button>
            </article>
            <article class="tile blue" data-section="backups">
                <button class="open"><span class="glyph">↶</span><strong>Бэкапы</strong><small>Сохранения миров</small></button>
                <button class="pin" title="Закрепить на начальном экране">⌖</button>
            </article>
            <article class="tile tile-wide charcoal" data-section="settings">
                <button class="open"><span class="glyph">⚙</span><strong>Настройки</strong><small>Аккаунты, Java и оформление</small></button>
                <button class="pin" title="Закрепить на начальном экране">⌖</button>
            </article>
        </section>

        <p id="status" role="status">Для запуска разделов установите companion-версию MSC Launcher Metro.</p>
    </main>
    <script src="js/default.js"></script>
</body>
</html>
