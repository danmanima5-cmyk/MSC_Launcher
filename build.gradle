plugins {
    id 'java'
    id 'application'
    id 'xyz.wagyourtail.jvmdowngrader' version '1.3.6'
}

group = 'com.launcher'
version = '2.1-LTS'

java {
    // Используем тот JDK, на котором запущен сам Gradle (должен быть 17+),
    // без принудительного toolchain — чтобы не требовать скачивания/наличия
    // отдельно установленного JDK 17, если у вас уже стоит более новый (17/21/...).
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

jvmdg.downgradeTo = JavaVersion.VERSION_1_8

// Классы лежат в default package (без package ...), как и в исходном проекте —
// поэтому mainClass указывается просто как "Main".
application {
    mainClass = 'Main'
}

repositories {
    mavenCentral()
}

configurations {
    proguard
}

dependencies {
    proguard "com.guardsquare:proguard-base:7.6.1"
    // Только API для компиляции. В дистрибутив эти JAR не попадают:
    // при запуске используется JavaFX, встроенный в полную Java 8.
    def javaFxCompileVersion = '17.0.16'
    compileOnly "org.openjfx:javafx-base:${javaFxCompileVersion}:win"
    compileOnly "org.openjfx:javafx-graphics:${javaFxCompileVersion}:win"
    compileOnly "org.openjfx:javafx-controls:${javaFxCompileVersion}:win"
    compileOnly "org.openjfx:javafx-swing:${javaFxCompileVersion}:win"
    compileOnly "org.openjfx:javafx-media:${javaFxCompileVersion}:win"
    compileOnly "org.openjfx:javafx-web:${javaFxCompileVersion}:win"
    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.11.4"
}

// Ресурсы (иконки, картинки, wallpaper и т.д.) лежат в src/main/resources/Resources/...
// и попадают в classpath / jar автоматически благодаря стандартной раскладке Gradle.

tasks.jar {
    // Этот jar нужен только как вход для JVM Downgrader. Пользовательский
    // Java 8 jar создаётся задачей shadeDowngradedApi без classifier.
    archiveClassifier = 'modern'
    dependsOn 'copyRuntimeLibs'
    manifest {
        attributes(
                'Main-Class': 'Main',
                'Implementation-Title': 'MSC Launcher',
                'Implementation-Version': project.version,
                'Class-Path': configurations.runtimeClasspath.files.collect { "libs/${it.name}" }.join(' ')
        )
    }
}

tasks.named('downgradeJar') {
    archiveClassifier = 'java8-unshaded'
}

def java8Jar = tasks.named('shadeDowngradedApi') {
    archiveFileName = 'MSC_Launcher.jar'
    // Always place the runnable launcher JAR in this project's build/libs directory.
    // This avoids accidentally picking up an older artifact from another project copy.
    destinationDirectory = layout.buildDirectory.dir('libs')
}

def releaseArtifact = tasks.register('releaseArtifact', Copy) {
    group = 'distribution'
    description = 'Creates and verifies the canonical Java 8 JAR for GitHub Releases.'
    dependsOn java8Jar
    from(java8Jar.flatMap { it.archiveFile })
    into layout.buildDirectory.dir('release')
    rename { 'MSC_Launcher.jar' }

    doLast {
        def releaseJar = layout.buildDirectory.file('release/MSC_Launcher.jar').get().asFile
        if (!releaseJar.isFile()) {
            throw new GradleException("Release JAR was not created: ${releaseJar}")
        }
        new java.util.jar.JarFile(releaseJar).withCloseable { jar ->
            def requiredEntries = [
                    'Main.class',
                    'GitHubUpdater.class',
                    'JavaFxUpdaterDialogs.class'
            ]
            def missing = requiredEntries.findAll { jar.getJarEntry(it) == null }
            if (!missing.isEmpty()) {
                throw new GradleException(
                        "Release JAR is unsafe for self-update; missing: ${missing.join(', ')}")
            }
            def attributes = jar.manifest?.mainAttributes
            if (attributes?.getValue('Main-Class') != 'Main') {
                throw new GradleException('Release JAR manifest must contain Main-Class: Main')
            }
            if (attributes?.getValue('Implementation-Version') != project.version.toString()) {
                throw new GradleException(
                        "Release JAR version does not match project version ${project.version}")
            }
        }
    }
}

tasks.assemble {
    dependsOn java8Jar, releaseArtifact
}

def obfuscatedJar = layout.buildDirectory.file("release/MSC_Launcher-obfuscated.jar")

tasks.register("obfuscatedReleaseArtifact", JavaExec) {
    group = "distribution"
    description = "Obfuscates the canonical GitHub release JAR with ProGuard."
    dependsOn releaseArtifact
    classpath = configurations.proguard
    mainClass = "proguard.ProGuard"
    inputs.file(layout.buildDirectory.file("release/MSC_Launcher.jar"))
    inputs.file("proguard.pro")
    outputs.file(obfuscatedJar)
    doFirst {
        delete obfuscatedJar
        args "-injars", layout.buildDirectory.file("release/MSC_Launcher.jar").get().asFile,
                "-outjars", obfuscatedJar.get().asFile,
                "@${file("proguard.pro").absolutePath}"
        // ProGuard 7.6 cannot read the Java 25 class format.  A release can
        // still be produced with -PskipProguardJmods because proguard.pro
        // already suppresses unresolved platform-class warnings; this is
        // useful on build machines that only have a newer JDK installed.
        if (!providers.gradleProperty("skipProguardJmods").isPresent()) {
            fileTree(new File(providers.gradleProperty("proguardJavaHome").orElse(System.getProperty("java.home")).get(), "jmods")).matching {
                include "*.jmod"
            }.files.sort().each { jmod ->
                args "-libraryjars", "${jmod.absolutePath}(!**.jar;!module-info.class)"
            }
        }
        configurations.compileClasspath.files.each { library ->
            args "-libraryjars", library
        }
    }
    doLast {
        new java.util.jar.JarFile(obfuscatedJar.get().asFile).withCloseable { jar ->
            if (jar.manifest?.mainAttributes?.getValue("Main-Class") != "Main" ||
                    jar.getJarEntry("Main.class") == null) {
                throw new GradleException("Obfuscated JAR lost its executable entry point")
            }
        }
    }
}

tasks.startScripts {
    dependsOn java8Jar
    classpath = files(java8Jar.flatMap { it.archiveFile })
}

distributions {
    main {
        contents {
            exclude '**/*-modern.jar'
            from(java8Jar.flatMap { it.archiveFile }) {
                into 'lib'
            }
        }
    }
}

tasks.register('copyRuntimeLibs', Copy) {
    from configurations.runtimeClasspath
    into layout.buildDirectory.dir('libs/libs')
}

tasks.test {
    useJUnitPlatform()
}

// Кодировка исходников — UTF-8 (в коде используется кириллица в комментариях/строках).
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
}

def bundledJavaHomeProvider = providers.provider {
    def explicit = providers.gradleProperty('bundledJavaHome').orNull
    if (!explicit) {
        throw new GradleException(
                'Для bundledDistZip укажите Java 8: -PbundledJavaHome=C:\\path\\to\\jre8')
    }
    explicit
}

tasks.register('installBundledDist', Copy) {
    group = 'distribution'
    description = 'Builds a runnable app folder with an embedded Java runtime.'
    dependsOn tasks.installDist

    def outputDir = layout.buildDirectory.dir("bundled/${project.name}")
    into outputDir
    from { tasks.installDist.destinationDir }
    from(bundledJavaHomeProvider) {
        into 'runtime'
    }

    doFirst {
        def javaHome = file(bundledJavaHomeProvider.get())
        def releaseFile = new File(javaHome, 'release')
        if (!releaseFile.isFile() || !(releaseFile.getText('UTF-8') =~ /JAVA_VERSION="1\.8\./)) {
            throw new GradleException("bundledJavaHome должен указывать на Java 8: ${javaHome}")
        }
        def bundledJavaFx = [
                new File(javaHome, 'lib/ext/jfxrt.jar'),
                new File(javaHome, 'jre/lib/ext/jfxrt.jar')
        ].any { it.isFile() }
        if (!bundledJavaFx) {
            throw new GradleException(
                    "В bundledJavaHome нет встроенного JavaFX 8 (jfxrt.jar). "
                            + "Используйте Oracle Java 8 или Full-сборку Liberica JRE/JDK 8: ${javaHome}")
        }
        delete outputDir
    }

    doLast {
        def appDir = outputDir.get().asFile
        def unixScript = new File(appDir, "run.sh")
        unixScript.text = '''#!/usr/bin/env sh
DIR="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
exec "$DIR/runtime/bin/java" -cp "$DIR/lib/*" Main "$@"
'''
        unixScript.setExecutable(true)

        def windowsScript = new File(appDir, "run.bat")
        windowsScript.text = '''@echo off
set "DIR=%~dp0"
"%DIR%runtime\\bin\\java.exe" -cp "%DIR%lib\\*" Main %*
'''
    }
}

tasks.register('bundledDistZip', Zip) {
    group = 'distribution'
    description = 'Packages the launcher together with an embedded Java runtime.'
    dependsOn tasks.installBundledDist
    archiveBaseName = "${project.name}-with-java"
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from(layout.buildDirectory.dir("bundled/${project.name}")) {
        into project.name
    }
}

tasks.register('windowsInstaller', Exec) {
    group = 'distribution'
    description = 'Builds the migration-safe Windows installer with Inno Setup 6.'
    dependsOn tasks.installBundledDist
    onlyIf { org.gradle.internal.os.OperatingSystem.current().isWindows() }
    def iscc = providers.gradleProperty('innoSetupCompiler').orElse(
            'C:/Program Files (x86)/Inno Setup 6/ISCC.exe')
    commandLine iscc.get(), file('installer/msc-launcher.iss').absolutePath
}

tasks.register('signWindowsInstaller', Exec) {
    group = 'distribution'
    description = 'Authenticode-signs and verifies the Windows installer.'
    dependsOn tasks.windowsInstaller
    onlyIf { org.gradle.internal.os.OperatingSystem.current().isWindows() }
    def installerFile = layout.buildDirectory.file(
            "installer/MSC-Launcher-${project.version}-Setup.exe")
    inputs.file(installerFile)
    outputs.file(installerFile)
    outputs.upToDateWhen { false }
    commandLine 'powershell.exe', '-NoProfile', '-ExecutionPolicy', 'Bypass',
            '-File', file('installer/SignWindowsRelease.ps1').absolutePath,
            '-InputFile', installerFile.get().asFile.absolutePath
}

// Separate Metro edition. These tasks do not replace or reconfigure any of the
// existing standard-edition artifacts above.
def metroJar = tasks.register('metroJar', Jar) {
    group = 'build'
    description = 'Builds the separate Metro-edition Java 8 JAR.'
    dependsOn java8Jar
    archiveBaseName = 'MSC-Launcher-Metro'
    archiveVersion = project.version
    archiveClassifier = ''
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from({ zipTree(java8Jar.get().archiveFile.get().asFile) }) {
        exclude 'META-INF/MANIFEST.MF'
    }
    manifest {
        attributes(
                'Main-Class': 'MetroMain',
                'Implementation-Title': 'MSC Launcher Metro',
                'Implementation-Version': project.version,
                'MSC-Launcher-Edition': 'metro'
        )
    }
}

def metroPortableDir = layout.buildDirectory.dir('metro/portable/MSC Launcher Metro')

tasks.register('installMetroDist', Copy) {
    group = 'distribution'
    description = 'Creates the separate portable Metro edition (system Java 8+ required).'
    dependsOn metroJar
    into metroPortableDir
    from(metroJar.flatMap { it.archiveFile }) {
        into 'lib'
    }
    from('installer/RegisterMetroCompanion.ps1')
    doFirst {
        delete metroPortableDir
    }
    doLast {
        def appDir = metroPortableDir.get().asFile
        new File(appDir, 'run-metro.bat').text = """@echo off
set "DIR=%~dp0"
powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%DIR%RegisterMetroCompanion.ps1"
start "MSC Launcher Metro" javaw.exe -jar "%DIR%lib\\MSC-Launcher-Metro-${project.version}.jar"
"""
    }
}

tasks.register('metroDistZip', Zip) {
    group = 'distribution'
    description = 'Packages the separate portable Metro edition.'
    dependsOn tasks.installMetroDist
    archiveBaseName = 'MSC-Launcher-Metro'
    archiveVersion = project.version
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from(metroPortableDir)
}

def metroBundledDir = layout.buildDirectory.dir('bundled/msc-launcher-metro')

tasks.register('installMetroBundledDist', Copy) {
    group = 'distribution'
    description = 'Builds the separate Metro edition with an embedded Java 8 runtime.'
    dependsOn metroJar
    into metroBundledDir
    from(metroJar.flatMap { it.archiveFile }) {
        into 'lib'
    }
    from('installer/RegisterMetroCompanion.ps1')
    from(bundledJavaHomeProvider) {
        into 'runtime'
    }
    doFirst {
        def javaHome = file(bundledJavaHomeProvider.get())
        def releaseFile = new File(javaHome, 'release')
        if (!releaseFile.isFile() || !(releaseFile.getText('UTF-8') =~ /JAVA_VERSION="1\.8\./)) {
            throw new GradleException("bundledJavaHome должен указывать на Java 8: ${javaHome}")
        }
        def bundledJavaFx = [
                new File(javaHome, 'lib/ext/jfxrt.jar'),
                new File(javaHome, 'jre/lib/ext/jfxrt.jar')
        ].any { it.isFile() }
        if (!bundledJavaFx) {
            throw new GradleException('Для Metro-сборки нужна полная Java 8 со встроенным JavaFX.')
        }
        delete metroBundledDir
    }
    doLast {
        def appDir = metroBundledDir.get().asFile
        new File(appDir, 'run-metro.bat').text = """@echo off
set "DIR=%~dp0"
powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%DIR%RegisterMetroCompanion.ps1"
"%DIR%runtime\\bin\\javaw.exe" -jar "%DIR%lib\\MSC-Launcher-Metro-${project.version}.jar"
"""
    }
}

tasks.register('metroWindowsInstaller', Exec) {
    group = 'distribution'
    description = 'Builds the separate Windows 8.1 Metro-edition installer.'
    dependsOn tasks.installMetroBundledDist
    onlyIf { org.gradle.internal.os.OperatingSystem.current().isWindows() }
    def iscc = providers.gradleProperty('innoSetupCompiler').orElse(
            'C:/Program Files (x86)/Inno Setup 6/ISCC.exe')
    commandLine iscc.get(), file('installer/msc-launcher-metro.iss').absolutePath
}

tasks.register('metroAssemble') {
    group = 'build'
    description = 'Builds only the separate Metro JAR and portable ZIP.'
    dependsOn metroJar, tasks.metroDistZip
}

def makeAppxPath = providers.gradleProperty('makeAppx').orElse(
        'C:/Program Files (x86)/Windows Kits/10/App Certification Kit/makeappx.exe')

tasks.register('metroAppx', Exec) {
    group = 'distribution'
    description = 'Builds the real Windows 8.1 APPX tile shell (unsigned).'
    onlyIf { org.gradle.internal.os.OperatingSystem.current().isWindows() }
    def output = layout.buildDirectory.file("appx/MSC-Launcher-Tiles-${project.version}.appx")
    inputs.dir('metro-appx')
    outputs.file(output)
    doFirst {
        delete output
        output.get().asFile.parentFile.mkdirs()
    }
    commandLine makeAppxPath.get(), 'pack', '/d', file('metro-appx').absolutePath,
            '/p', output.get().asFile.absolutePath, '/o'
}

tasks.register('metroAppxSideload', Exec) {
    group = 'distribution'
    description = 'Signs the Windows 8.1 APPX with an ephemeral development certificate.'
    dependsOn tasks.metroAppx
    onlyIf { org.gradle.internal.os.OperatingSystem.current().isWindows() }
    def unsignedAppx = layout.buildDirectory.file("appx/MSC-Launcher-Tiles-${project.version}.appx")
    def signedAppx = layout.buildDirectory.file("appx/MSC-Launcher-Tiles-${project.version}-sideload.appx")
    def certificate = layout.buildDirectory.file('appx/MSC-Launcher-Tiles.cer')
    inputs.file(unsignedAppx)
    inputs.file('installer/SignMetroAppxForSideload.ps1')
    outputs.files(signedAppx, certificate)
    commandLine 'powershell.exe', '-NoProfile', '-ExecutionPolicy', 'Bypass',
            '-File', file('installer/SignMetroAppxForSideload.ps1').absolutePath,
            '-InputAppx', unsignedAppx.get().asFile.absolutePath,
            '-OutputAppx', signedAppx.get().asFile.absolutePath,
            '-CertificateFile', certificate.get().asFile.absolutePath
}

tasks.register('metroAppxSideloadZip', Zip) {
    group = 'distribution'
    description = 'Packages the signed Windows 8.1 APPX, public certificate and install script.'
    dependsOn tasks.metroAppxSideload
    archiveBaseName = 'MSC-Launcher-Tiles'
    archiveVersion = project.version
    archiveClassifier = 'sideload'
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from(layout.buildDirectory.file("appx/MSC-Launcher-Tiles-${project.version}-sideload.appx"))
    from(layout.buildDirectory.file('appx/MSC-Launcher-Tiles.cer'))
    from('installer/InstallMetroAppx.ps1') {
        rename { 'Install.ps1' }
    }
    from('installer/InstallMetroAppx.cmd') {
        rename { 'Install.cmd' }
    }
    from('metro-appx/README.md')
}
